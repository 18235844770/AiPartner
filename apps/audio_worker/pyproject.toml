[project]
name = "ai-companion-audio-worker"
version = "0.1.0"
description = "Local ASR and cloud TTS worker for AI Companion"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    # 可选 ASR 依赖仍使用 NumPy 1.x；勿升到 2.x
    "numpy>=1.26,<2",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
# 真实模型依赖体积大、易与主业务冲突，单独安装。
# CUDA torch 请用脚本（PyPI 默认多为 CPU 轮）：
#   powershell -File .\scripts\setup_real_models.ps1
asr = [
    "funasr>=1.1.0",
    "modelscope>=1.20.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
