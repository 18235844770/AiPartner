<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f1f6">
  <title>AI 伴侣</title>
  <link rel="stylesheet" href="app.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main class="shell">
    <p id="notice" class="notice" role="status" hidden></p>

    <section id="auth" class="page auth" aria-labelledby="auth-title" hidden>
      <div class="mark" aria-hidden="true">伴</div>
      <h1 id="auth-title">登录</h1>
      <form id="auth-form">
        <label>用户名<input name="username" autocomplete="username" required minlength="3" maxlength="64"></label>
        <label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label>
        <button class="primary" type="submit">登录</button>
        <button class="plain" id="toggle-auth" type="button">创建账号</button>
      </form>
    </section>

    <section id="setup" class="page auth" aria-labelledby="setup-title" hidden>
      <div class="mark" aria-hidden="true">伴</div>
      <h1 id="setup-title">正在初始化伴侣</h1>
      <button id="retry-setup" class="primary" type="button" hidden>重试初始化</button>
      <button class="plain" data-logout type="button">退出登录</button>
    </section>

    <section id="home" class="page home" aria-labelledby="home-name" hidden>
      <header class="home-head">
        <div>
          <p class="muted" id="today"></p>
          <h1 id="home-name">伴侣</h1>
          <p class="presence"><span class="dot" aria-hidden="true"></span><span id="home-emotion">在</span></p>
        </div>
        <div class="mark emotion-mark" data-companion-mark aria-hidden="true">伴</div>
      </header>
      <article id="last-message" class="latest" hidden>
        <p class="muted">最近一条</p>
        <p id="last-content"></p>
        <time id="last-time" class="muted"></time>
      </article>
      <button class="primary" type="button" data-page="chat">继续说</button>
    </section>

    <section id="chat" class="page chat" aria-labelledby="chat-name" hidden>
      <header class="chat-head">
        <div class="mark small emotion-mark" data-companion-mark aria-hidden="true">伴</div>
        <div><h1 id="chat-name">伴侣</h1><p id="chat-emotion" class="muted">在</p></div>
        <span id="connection" class="muted" role="status"></span>
      </header>
      <div class="thread" id="thread">
        <button class="plain" id="older" type="button" hidden>加载较早消息</button>
        <ol id="messages" aria-label="聊天记录"></ol>
      </div>
      <form class="compose" id="send-form">
        <input name="content" aria-label="消息" autocomplete="off" placeholder="说点什么" required maxlength="8000">
        <button class="primary" type="submit">发送</button>
      </form>
    </section>

    <section id="settings" class="page settings" aria-labelledby="settings-title" hidden>
      <h1 id="settings-title">设置</h1>
      <form id="profile-form" class="panel">
        <h2>账户资料</h2>
        <p id="profile-username" class="muted"></p>
        <label>显示名称<input name="display_name" required maxlength="64"></label>
        <label>时区<input name="timezone" required maxlength="64" placeholder="Asia/Shanghai"></label>
        <button class="secondary" type="submit">保存资料</button>
      </form>
      <form id="password-form" class="panel">
        <h2>修改密码</h2>
        <label>当前密码<input name="current_password" type="password" autocomplete="current-password" required maxlength="128"></label>
        <label>新密码<input name="new_password" type="password" autocomplete="new-password" required minlength="8" maxlength="128"></label>
        <button class="secondary" type="submit">更新密码</button>
      </form>
      <button class="secondary" data-logout type="button">退出登录</button>
      <details class="panel">
        <summary>注销账户</summary>
        <form id="delete-form">
          <p>注销后会删除伴侣、聊天记录和个人资料。</p>
          <label>确认密码<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label>
          <button class="danger" type="submit">确认注销</button>
        </form>
      </details>
    </section>

    <nav id="tabs" aria-label="主导航" hidden>
      <button type="button" data-page="home">在一起</button>
      <button type="button" data-page="chat">说话</button>
      <button type="button" data-page="settings">设置</button>
    </nav>
  </main>
</body>
</html>
