[project]
name = "ai-companion-server"
version = "0.1.0"
description = "AI Companion local backend"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14",
    "arq>=0.28.0",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "fastembed>=0.4",
    "httpx>=0.28",
    "pgvector>=0.3",
    "pydantic-settings>=2.6",
    "redis>=5.2,<6",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
